events { worker_connections 4096; }

http {
    # Docker's embedded DNS. A stopped container drops out of it and a
    # restarted one can come back on a new IP, so names are re-resolved rather
    # than pinned to whatever they pointed at when nginx booted.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream api {
        zone api 64k;
        server api-1:8080 resolve max_fails=1 fail_timeout=5s;
        server api-2:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 256;
    }

    server {
        listen 8080;
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            # Fail over only when a connection could not be established. POST
            # is non-idempotent, so nginx never re-sends a request that already
            # reached an instance; doing that would create a duplicate the
            # harness never asked for.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }
}
