events {
    worker_connections 2048;
}

http {
    upstream api {
        server api-1:8080;
        server api-2:8080;
        keepalive 120;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Never let nginx retry a POST on its own. A silent retry would
            # produce a replay the harness did not ask for and muddy the count.
            proxy_next_upstream off;
        }
    }
}