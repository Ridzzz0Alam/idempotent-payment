events { worker_connections 4096; }

http {
    upstream api {
        server api-1:8080;
        server api-2:8080;
        keepalive 256;
    }

    server {
        listen 8080;
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # A silent retry on the other backend would create a duplicate the
            # harness never asked for.
            proxy_next_upstream off;
        }
    }
}
